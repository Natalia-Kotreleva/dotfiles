format = """
$directory\
$git_branch\
$git_status\
$character"""

add_newline = true

[directory]
style = "#7aa2f7"
truncation_length = 4
truncate_to_repo = false

[git_branch]
format = "[($branch)]($style)"
style = "#9ece6a"

[git_status]
format = " [$all_status$ahead_behind]($style)"
style = "#e0af68"

[character]
success_symbol = "[ » ](bold #7aa2f7)"
error_symbol = "[ » ](bold #f7768e)"
